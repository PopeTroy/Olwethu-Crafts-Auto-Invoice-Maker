name: Generate Invoice PDF (Olwethu Crafts Auto)

on:
  workflow_dispatch:
    inputs:
      invoice_number:
        description: 'Invoice Number'
        required: true
        default: 'INV-2026-001'
      date:
        description: 'Invoice Date (YYYY-MM-DD)'
        required: true
        default: '2026-08-06'
      client_name:
        description: 'Client Full Name / Company'
        required: true
        default: 'Mbuso Tshabalala'
      client_address:
        description: 'Client Address'
        required: true
        default: '123 Main Street, Sandton, Johannesburg'
      client_telephone:
        description: 'Client Telephone'
        required: true
        default: '082 123 4567'
      client_email:
        description: 'Client Email'
        required: true
        default: 'client@example.com'

      # 10 Separate Line Item Inputs (Format: Description, Qty, Price)
      item_1:
        description: '1. Description, Qty, Price'
        required: false
        default: 'Engine Rebuild, 1, 15000'
      item_2:
        description: '2. Description, Qty, Price'
        required: false
        default: 'Diagnostics & Auto Electrical, 1, 1200'
      item_3:
        description: '3. Description, Qty, Price'
        required: false
        default: ''
      item_4:
        description: '4. Description, Qty, Price'
        required: false
        default: ''
      item_5:
        description: '5. Description, Qty, Price'
        required: false
        default: ''
      item_6:
        description: '6. Description, Qty, Price'
        required: false
        default: ''
      item_7:
        description: '7. Description, Qty, Price'
        required: false
        default: ''
      item_8:
        description: '8. Description, Qty, Price'
        required: false
        default: ''
      item_9:
        description: '9. Description, Qty, Price'
        required: false
        default: ''
      item_10:
        description: '10. Description, Qty, Price'
        required: false
        default: ''

jobs:
  build-invoice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fpdf2 requests python-dotenv openai

      - name: Execute Invoice Generator Script
        env:
          NVCF_TARGET_SERVICE_KEY: ${{ secrets.NVCF_TARGET_SERVICE_KEY }}
          INVOICE_NUMBER: ${{ github.event.inputs.invoice_number }}
          INVOICE_DATE: ${{ github.event.inputs.date }}
          CLIENT_NAME: ${{ github.event.inputs.client_name }}
          CLIENT_ADDRESS: ${{ github.event.inputs.client_address }}
          CLIENT_TELEPHONE: ${{ github.event.inputs.client_telephone }}
          CLIENT_EMAIL: ${{ github.event.inputs.client_email }}
          ITEM_1: ${{ github.event.inputs.item_1 }}
          ITEM_2: ${{ github.event.inputs.item_2 }}
          ITEM_3: ${{ github.event.inputs.item_3 }}
          ITEM_4: ${{ github.event.inputs.item_4 }}
          ITEM_5: ${{ github.event.inputs.item_5 }}
          ITEM_6: ${{ github.event.inputs.item_6 }}
          ITEM_7: ${{ github.event.inputs.item_7 }}
          ITEM_8: ${{ github.event.inputs.item_8 }}
          ITEM_9: ${{ github.event.inputs.item_9 }}
          ITEM_10: ${{ github.event.inputs.item_10 }}
        run: python generate_invoice.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-pdf
          path: invoice.pdf
